# ASL-200 body controls CI.
#
# Every PR builds the C99 firmware for the host, runs the C unit tests and
# cppcheck, cross-compiles the Cortex-M4F image, and then runs the closed-loop
# SIL matrix (C firmware <-> virtual CAN <-> plant model) for every variant in
# parallel. The report job merges the per-variant results into one
# variant x scenario table, an offline dashboard (matrix.html + animated trace
# viewers) and, on PRs, a sticky comment with plots/GIFs of failures and sensor cases.
#
# In a CODESYS shop this module would be IEC 61131-3 Structured Text; the
# harness and workflow are the same.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: host build · unit tests · cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - name: Validate variants + generate params
        run: python3 codegen/gen_params.py --out build/generated
      - name: Configure + build (warnings are errors)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DASL200_WERROR=ON
          cmake --build build -j
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: cppcheck
        run: make cppcheck

  target:
    name: cross-compile (arm-none-eabi, ${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - asl200_diesel_autocar
          - asl200_cng_peterbilt
          - asl200_electric_mack
          - asl200_diesel_mack_longreach
          - asl200_diesel_autocar_eco0412
          - asl200_cng_peterbilt_eco0412
          - asl200_electric_mack_eco0412
          - asl200_diesel_mack_longreach_eco0412
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: |
          cmake -S . -B build-target -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=MinSizeRel -DASL200_WERROR=ON -DASL200_VARIANT=${{ matrix.variant }}
          cmake --build build-target -j
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: build-target/asl200_fw_${{ matrix.variant }}.*
          if-no-files-found: ignore

  sil:
    name: SIL · ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - asl200_diesel_autocar
          - asl200_cng_peterbilt
          - asl200_electric_mack
          - asl200_diesel_mack_longreach
          - asl200_diesel_autocar_eco0412
          - asl200_cng_peterbilt_eco0412
          - asl200_electric_mack_eco0412
          - asl200_diesel_mack_longreach_eco0412
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build SIL libraries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Scenario matrix (${{ matrix.variant }})
        run: python3 -m pytest tests/sil --variant ${{ matrix.variant }} --junitxml=out/junit-${{ matrix.variant }}.xml -q
      - name: Upload traces, plots, results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-${{ matrix.variant }}
          path: out/
          retention-days: 14

  report:
    name: SIL report
    needs: sil
    if: always() && needs.sil.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # pushes selected media to the ci-media branch
      pull-requests: write   # sticky PR comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "sil-*", path: out, merge-multiple: true }
      - name: Variant x scenario summary
        id: summary
        run: |
          python3 -m sil.matrix --out out --summary-only > /dev/null || echo "failed=1" >> "$GITHUB_OUTPUT"
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Dashboard (matrix.html + per-case animated viewers)
        run: python3 viz/build.py --out out
      - name: Render failures and representative sensor cases
        run: python3 tools/ci_media.py --out out --media out/media --max 4 --include-passing
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: sil-report
          path: |
            out/matrix.html
            out/summary.md
            out/summary.json
            out/media/
            out/*/*.html
            out/*/*.png
          retention-days: 30
      - name: Publish media
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -s out/media/index.json ] || [ "$(cat out/media/index.json)" = "[]" ]; then exit 0; fi
          git config --global user.name "asl200-ci"; git config --global user.email "ci@users.noreply.github.com"
          git clone --quiet --depth 1 --branch ci-media "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media \
            || { git init -q media && git -C media checkout -q --orphan ci-media && git -C media remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
          mkdir -p "media/$DEST" && cp out/media/* "media/$DEST/"
          git -C media add -A && git -C media commit -q -m "ci media for $DEST"
          for i in 1 2 3; do git -C media push -q origin ci-media && break; git -C media pull -q --rebase origin ci-media; done
          echo "base=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-media/$DEST" >> "$GITHUB_OUTPUT"
      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          MEDIA_BASE: ${{ steps.media.outputs.base }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- asl200-sil-report -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `${marker}\n## ASL-200 SIL matrix\n\n` + fs.readFileSync("out/summary.md", "utf8");
            const media = JSON.parse(fs.readFileSync("out/media/index.json", "utf8") || "[]");
            if (media.length && process.env.MEDIA_BASE) {
              body += "\n#### Selected cases (failures first)\n";
              for (const m of media) {
                body += `\n**\`${m.variant}\` / \`${m.scenario}\`** - ${m.reason}\n\n`;
                if (m.gif) body += `![${m.variant} ${m.scenario} animation](${process.env.MEDIA_BASE}/${m.gif})\n\n`;
                if (m.png) body += `<details><summary>trajectory plot</summary>\n\n![${m.variant} ${m.scenario} plot](${process.env.MEDIA_BASE}/${m.png})\n\n</details>\n`;
              }
            }
            body += `\n\nDashboard, animated trace viewers and raw traces: **sil-report** artifact on [this run](${runUrl}) (open \`matrix.html\`).` +
                    `\n<sub>commit ${context.payload.pull_request.head.sha.slice(0, 7)} · closed-loop SIL: C firmware ⇄ virtual CAN (J1939/DBC) ⇄ plant model</sub>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Fail if any SIL case failed
        if: steps.summary.outputs.failed == '1'
        run: exit 1
