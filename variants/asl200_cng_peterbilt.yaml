# ASL-200 on a CNG conventional chassis. PTO pump runs at a lower idle so the
# hydraulic arm is slightly slower at full command.
inherits: common.yaml
name: asl200_cng_peterbilt
description: ASL-200, CNG chassis, hydraulic arm (lower PTO flow)
hardware:
  chassis: cng_conventional
  actuator:
    lift_full_scale_dps: 76.0
    reach_full_scale_mmps: 1150.0
