# ASL-200 ePTO build on a battery-electric chassis. Arm lift and reach are
# driven by electric actuators fed from the traction pack; the lift motor
# brakes regeneratively into the pack.
inherits: common.yaml
name: asl200_electric_mack
description: ASL-200, battery-electric chassis, electric arm actuators
controls:
  interlocks:
    batt_temp_max_c: 55.0
  motion:
    lift_speed_dps: 80.0
    lower_speed_dps: 81.0
    reach_speed_mmps: 1300.0
    lift_accel_dps2: 120.0
    decel_zone_deg: 36.0
    lift_stop_zone_deg: 36.0
    reach_stop_zone_mm: 400.0
  requirements:
    cycle_time_budget_s: 13.5
hardware:
  powertrain: electric
  chassis: bev_lowcab
  actuator:
    lift_tau_ms: 50
    lift_accel_limit_dps2: 200.0
    reach_accel_limit_mmps2: 2500.0
    onset_delay_ms: 30
    current_limit_a: 180.0
    regen_power_dps3: 6150.0
    regen_hot_factor: 0.9
    brake_engage_ms: 100
    brake_release_ms: 40
    torque_prove_unloaded_ms: 25
    torque_prove_loaded_ms: 130
    derate_full_c: 10.0
    derate_min_c: -20.0
    derate_min_factor: 0.18
